version: "0.5"

# Dev overlay: process-compose up -f process-compose.yaml -f process-compose.dev.yaml
# Site rebuilds live in the main file; this only adds the liquidsoap restarter.
# A separate file, not a flag: process-compose has no profile mechanism, and a
# file you have to name cannot start by accident.
processes:
  # Liquidsoap has no reload; the stream drops for ~1s and listeners reconnect.
  watch-radio:
    command: >
      watchexec
      --watch radio/radio.liq
      --debounce 500ms --on-busy-update=restart
      -- process-compose process restart liquidsoap
    depends_on:
      liquidsoap:
        condition: process_started

  # Not watched: radio/icecast.xml (a restart drops every listener and the
  # source), bin/*.sh (resolved to the nix wrapper frozen at devshell entry;
  # needs `direnv reload`), nginx (config is a derivation; same).
