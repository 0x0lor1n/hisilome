{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}
{% block description %}<meta name="description" content="{{ page.description }}">{% endblock description %}

{% block content %}
<h1>{{ page.title }}</h1>
{{ <post_meta page={page} permalink={true} /> }}
{{ <series_strip page={page} /> }}
{{ <body html={page.content} /> }}

<p><a {{ <href path="/" /> }}>&larr; back to all posts</a></p>
{% endblock content %}
