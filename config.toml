base_url = "https://hisilo.me"
title = "Hísilómë"
# Channel text of rss.xml and the site's fallback meta description.
description = "Writeups and worklogs by 0x0lor1n: hardware, NixOS, ZFS, firmware, a web page with no JavaScript, and a radio."
author = "0x0lor1n"

# d2 sources sit next to each post; the compiled svg is what the page inlines.
ignored_content = ["*.d2"]

generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
  { name = "tags" },
]

[markdown]
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
[markdown.highlighting]
extra_grammars = ["syntaxes/liquidsoap.tmLanguage.json"]
theme = "kanagawa-wave"
style = "inline"
